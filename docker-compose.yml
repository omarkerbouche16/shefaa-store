version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shefaa
      POSTGRES_PASSWORD: shefaa_local_pw
      POSTGRES_DB: shefaa_webset
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shefaa -d shefaa_webset"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://shefaa:shefaa_local_pw@postgres:5432/shefaa_webset
      ENVIRONMENT: development
      PROJECT_NAME: "Shefaa API"
      BACKEND_CORS_ORIGINS: '["http://localhost:3000"]'
      GOOGLE_SHEET_WEBHOOK_URL: ""
      GOOGLE_SHEET_WEBHOOK_SECRET: ""
      META_PIXEL_ID: ""
      META_ACCESS_TOKEN: ""
      META_TEST_EVENT_CODE: ""
      TIKTOK_PIXEL_CODE: ""
      TIKTOK_ACCESS_TOKEN: ""
      SNAP_PIXEL_ID: ""
      SNAP_ACCESS_TOKEN: ""
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_META_PIXEL_ID: ""
      NEXT_PUBLIC_TIKTOK_PIXEL_ID: ""
      NEXT_PUBLIC_SNAP_PIXEL_ID: ""
    depends_on:
      - backend

volumes:
  postgres_data:
